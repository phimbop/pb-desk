name: Release & Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4) -> .dmg
          - platform: macos-latest
            target: aarch64-apple-darwin
            builder_args: '--mac dmg zip --arm64'
            name: macos-arm64
          # macOS Intel (x86_64) -> .dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            builder_args: '--mac dmg zip --x64'
            name: macos-x86_64
          # Linux Ubuntu (x86_64) -> .AppImage, .deb
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            builder_args: '--linux AppImage deb --x64'
            name: linux-x86_64
          # Windows (x86_64) -> .exe (NSIS installer), .msi
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            builder_args: '--win nsis portable --x64'
            name: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          key: ${{ matrix.target }}

      - name: Install Linux dependencies (WebKitGTK, RSVG, GStreamer codecs, Mold linker)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            clang \
            mold \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - name: Install frontend dependencies
        run: bun install

      - name: Build Rust Sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release -p pb_sidecar --target ${{ matrix.target }}
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/pb-sidecar target/release/pb-sidecar

      - name: Build Rust Sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p pb_sidecar --target ${{ matrix.target }}
          if (!(Test-Path "target/release")) { New-Item -ItemType Directory -Path "target/release" }
          Copy-Item "target/${{ matrix.target }}/release/pb-sidecar.exe" -Destination "target/release/pb-sidecar.exe"
          Copy-Item "target/${{ matrix.target }}/release/pb-sidecar.exe" -Destination "target/release/pb-sidecar"

      - name: Build Frontend & Electron App
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          bun run build:frontend
          bun run build:electron

      - name: Build & Package with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bunx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: PHIMBOP ${{ github.ref_name }}
          draft: ${{ github.event.inputs.release_draft == 'true' }}
          prerelease: false
          body: |
            ## PHIMBOP Desktop ${{ github.ref_name }}
            
            Ứng dụng xem phim desktop đa nền tảng.
            
            ### Các định dạng phát hành:
            - **Windows**: `PHIMBOP_*_x64-setup.exe` (NSIS Installer) & `PHIMBOP_*_x64.exe`
            - **macOS**: `PHIMBOP_*_aarch64.dmg` (Apple Silicon M-series) & `PHIMBOP_*_x64.dmg` (Intel)
            - **Linux**: `PHIMBOP_*_amd64.AppImage` (Portable) & `PHIMBOP_*_amd64.deb` (Debian/Ubuntu)
          files: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap

      - name: Upload build artifacts (CI backup)
        uses: actions/upload-artifact@v4
        with:
          name: phimbop-${{ matrix.name }}-bundles
          path: |
            dist-electron/
          if-no-files-found: ignore
          retention-days: 14
